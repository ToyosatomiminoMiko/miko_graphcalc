<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>GraphCalc DSL</title>
    <!-- PWA 浏览器外框色:由 vite.config.ts 的 PWA_CHROME_COLOR 在开发/构建时经
         transformIndexHtml 注入(与 manifest 的 theme_color / background_color
         共用同一个常量,设置只有一处,HTML 里不留字面量副本).
         它不等于页面底色 css/base.css 的 --color-bg-app(#0e101a):这里刻意更深,
         让独立窗口的状态栏与页面内容有分界. -->
    <meta name="theme-color" content="%PWA_CHROME_COLOR%">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GraphCalc">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <!-- 样式不在这里挂载:全部由 `src/main.ts` 分**两层** import -- 先库的聚合
         入口(`miko_ui/styles.css`:token + 控件 + 桌面窗口 + 编辑器外壳),再
         应用的五份(base / panels / editor / diagnostics / process).Vite 会把
         它们抽成产物里的一个 <link>,所以生产构建的首帧与以前一样,不吃 FOUC. -->
</head>

<body>
    <!-- 页面上唯一手写的宿主:桌面容器.
         3D 视口,窗口层 / 吸附预览 / Dock,五个窗口的正文与标题栏节点全部由
         `src/app/appViews.ts` + `miko_ui` 的 `mountDesktop()` 建(D1);
         这里不再出现任何窗口/面板宿主 id. -->
    <div id="app"></div>

    <script type="module" src="./src/main.ts"></script>
</body>

</html>
