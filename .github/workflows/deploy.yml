name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # UI 库的检查(边界守卫 / typecheck / vitest)与**发布**都在库自己的仓库里跑:
  #   https://github.com/ToyosatomiminoMiko/miko_ui
  #   (ci.yml 是检查,release.yml 出 GitHub release 与 npm 包)
  # 本仓库只从 npm 取它:package.json 里一条 `"miko_ui": "^0.1.2"`,`npm ci`
  # 直接从 registry 装好.所以这里不需要 checkout submodule,也不需要额外的凭据.
  # 装完之后 build.sh 还会把 miko_ui 对齐到 npm 的 `latest`(MIKO_UI_SYNC=auto),
  # 所以**每次 Pages 部署拿到的都是库的最新发布版**;CI=true 让"查不到 latest"
  # 直接失败,不会静默部署旧版本.
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # 生产构建唯一入口:安装锁定依赖 -> Rust lint -> 清理并构建 WASM ->
      # 前端/Rust 测试 -> TypeScript 检查 -> Vite 构建,分阶段日志由脚本输出.
      - name: Install, lint, test and build
        run: bash ./build.sh

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
