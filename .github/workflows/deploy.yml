name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # UI 库的检查(边界守卫 / typecheck / vitest)已经跟着库搬到它自己的仓库:
  #   https://github.com/ToyosatomiminoMiko/miko_ui  (.github/workflows/ci.yml)
  # 这个仓库现在只通过 package.json 里那条按 tag 固定的 GitHub 归档 URL 拿
  # `@miko/ui` 的产物,不再有库的源码,所以不需要(也无法)在这里检查它.
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # 生产构建唯一入口:安装锁定依赖 -> Rust lint -> 清理并构建 WASM ->
      # 前端/Rust 测试 -> TypeScript 检查 -> Vite 构建,分阶段日志由脚本输出.
      - name: Install, lint, test and build
        run: bash ./build.sh

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
