name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # UI 库的检查(边界守卫 / typecheck / vitest)与**发布**都在库自己的仓库里跑:
  #   https://github.com/ToyosatomiminoMiko/miko_ui
  #   (ci.yml 是检查,release.yml 出滚动 release 资产 `ui-latest`)
  # 本仓库不再有库的源码,也不从 npm 取它:`build.sh` 里的 `npm ci` 会触发
  # package.json 的 preinstall -> `scripts/fetch_ui.sh`,下载库挂出来的公开资产
  # `miko_ui_dist.tar.gz`,校验后解开到 `.cache/miko_ui/current`,再按 `file:`
  # 依赖链接进来.所以这里不需要 checkout submodule,也不需要任何 npm 凭据 --
  # 只要能访问 GitHub(actions/checkout 本来就要)就够了.
  # 同一步还会核对"手里这份是不是最新发布的":资产清单里的 `gitHead`(库打包时写入
  # 的构建 commit)与 `ui-latest` tag 指向的 commit 不一致就自动重取;查不到这个
  # 结论(资产不自证版本 / 断网)时这里**明确失败** -- 部署出去的不能是"说不清哪一版"
  # 的缓存(本地开发只警告).见 `scripts/fetch_ui.sh` 顶部 §7.
  # 顺序提醒:库那边的 Release workflow 得先绿,资产挂上了,这里的 CI 才有得取;
  # 在那之前本 job 会**明确失败**(fetch_ui.sh 打印 release 页面与手动步骤),这是
  # 刻意设计,不是配置错误.
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # 生产构建唯一入口:安装锁定依赖 -> Rust lint -> 清理并构建 WASM ->
      # 前端/Rust 测试 -> TypeScript 检查 -> Vite 构建,分阶段日志由脚本输出.
      - name: Install, lint, test and build
        # GITHUB_TOKEN 是给 preinstall 用的:查 `ui-latest` 的 tag,以及 github.com
        # 连不上时绕行 API 资产端点.公开仓库匿名也能查,但限额是 60 次/小时/出口 IP,
        # 而 runner 是共享出口;带上 token(contents: read 就够)才稳.
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash ./build.sh

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
